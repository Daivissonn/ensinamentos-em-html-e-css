<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores em css</title>
    <style>
        body {
            background-image: linear-gradient(to left, black, rgb(204, 92, 111));

            background-attachment: fixed;
        }

        /*uma coisa importantissima, das cores é que voce pode ajustar usando tambem "deg" e colocando tipo "45deg", "-45" e por ai vai, e pra ter mais cores, é so ir ajustando

        /* aqui é usado para fixar a cor */

        /* tem tambem o "to top" que voce coloca um " * " antes do body, atrar das chaves, isso é uma configuraçao global da css, que depois voce ajeita dentro das chaves com height: 100% */

    </style>

    <!--Se voce quiser uma cor tipo, que preencha mais essa tela, voce coloca os porcentos do lado do nome tipo "black  80%"-->

    <!-- tem o "circle" tambem, que a imagem vem surgindo do meio e vai se expandindo-->

    <!-- tem o "left" que eu estou usando que a cor vem da direita para esquerda-->

    <!--tem tambem o "to top" que voce coloca um " * " antes do body, atrar das chaves, isso é uma configuraçao global da css, que depois voce ajeita dentro das chaves com height: 100% -->

    <!-- O "to bottom" é quando a cor vem de cima para baixo-->
</head>
<body>
    <h1>Olá, mundo!</h1>
</body>
</html>
