<!--vamos criar uma calculadora-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora Decks</h1>
        <div class="calculadora">
            <input type="text" id="resultado" value="0" readonly>
        </div>
        <div class="botoes">
          <button onclick="calcular('soma')">+</button>
          <button onclick="calcular('subtracao')">-</button>
          <button onclick="calcular('multiplicacao')">*</button>
          <button onclick="calcular('divisao')">/</button>
          <button onclick="calcular('limpar')">C</button>
          <button onclick="calcular('igual')">=</button>
          <button onclick="calcular('1')">1</button>
          <button onclick="calcular('2')">2</button>
          <button onclick="calcular('3')">3</button>
          <button onclick="calcular('4')">4</button>
          <button onclick="calcular('5')">5</button>
          <button onclick="calcular('6')">6</button>
          <button onclick="calcular('7')">7</button>
          <button onclick="calcular('8')">8</button>
          <button onclick="calcular('9')">9</button>
          <button onclick="calcular('0')">0</button>
        </div>


</body>
</html>
